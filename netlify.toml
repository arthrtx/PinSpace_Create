# Página escondida da remoção de fundo (iframe do editor). A biblioteca de IA
# precisa de "eval", por isso só esta página o permite; não mostra conteúdo de
# utilizadores e só pode ser aberta dentro do próprio site.
[[headers]]
  for = "/bg-remove.html"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://staticimgly.com 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob: https://cdn.jsdelivr.net https://staticimgly.com; connect-src https: data: blob:; img-src data: blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/bg-remove"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://staticimgly.com 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob: https://cdn.jsdelivr.net https://staticimgly.com; connect-src https: data: blob:; img-src data: blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"

# Ficheiros internos que não devem ser servidos publicamente.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
